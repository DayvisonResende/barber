<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Clientes — FinnoTrato</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
        body { background: #09090b; color: #f4f4f5; font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.2s ease-out forwards; }
        .scale-in { animation: scaleIn 0.2s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="app">
        <div class="flex items-center justify-center h-screen">
            <div class="flex flex-col items-center gap-4">
                <div class="w-10 h-10 rounded-full border-4 border-zinc-700 border-t-amber-500 animate-spin"></div>
                <p class="text-zinc-500 text-sm">Verificando sessão...</p>
            </div>
        </div>
    </div>

    <script src="js/config.js" defer></script>
    <script src="js/clientes-panel-app.js" defer></script>
    <script src="js/client-insights.js" defer></script>
</body>
</html>
