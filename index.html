<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinnoTratoBarber - Agendamentos</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Supabase SDK -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0c0c0c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FinnoTrato">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">

    <!-- Estilos Customizados e Animações -->
    <link rel="stylesheet" href="style.css">

    <!-- Registro do Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registrado!', reg))
                    .catch(err => console.log('Erro ao registrar SW:', err));
            });
        }
    </script>
    <style>
        .fade-in-fast {
            animation: fadeInFast 0.15s ease-out forwards;
            will-change: opacity, transform;
        }

        @keyframes fadeInFast {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Otimização de toque para mobile */
        .nav-btn {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* Skeletons */
        .skeleton {
            background: linear-gradient(90deg, #18181b 25%, #27272a 50%, #18181b 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: 0.75rem;
        }

        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .animate-spin-once {
            animation: spinOnce 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes spinOnce {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>


<body class="min-h-screen flex justify-center">

    <!-- Contentor principal simulando um dispositivo móvel -->
    <div class="w-full max-w-md app-bg h-[100dvh] relative shadow-2xl flex flex-col overflow-hidden text-theme transition-colors duration-300">

        <!-- Cabeçalho / Top Bar -->
        <header id="app-header"
            class="px-6 py-5 flex justify-between items-center app-bg/80 backdrop-blur-md sticky top-0 z-20 border-b border-theme">
            <div class="flex items-center gap-2">
                <div id="header-logo-container" class="w-10 h-10 flex items-center justify-center overflow-hidden rounded-lg bg-zinc-800">
                    <i id="header-logo-icon" data-lucide="scissors" class="w-5 h-5 text-amber-500 opacity-20"></i>
                </div>

                <h1 id="header-shop-name" class="text-xl font-bold tracking-tight text-white">FinnoTrato<span class="text-amber-500">Barber</span></h1>
            </div>

            <div class="flex items-center gap-1">
                <button id="btn-refresh" class="p-2 text-zinc-400 hover:text-amber-500 transition-all active:scale-95 hidden" onclick="App.handleManualRefresh()">
                    <i id="icon-refresh" data-lucide="refresh-cw" class="w-5 h-5"></i>
                </button>

                <button id="btn-notifications" class="relative p-2 hidden" onclick="App.clearNotifications()">
                    <i data-lucide="bell" class="w-6 h-6 text-zinc-300"></i>
                    <span id="notification-badge"
                        class="hidden absolute top-1 right-2 w-3 h-3 bg-red-500 rounded-full border-2 border-zinc-950 animate-pulse-alert"></span>
                </button>
            </div>
        </header>

        <!-- Toast de Notificação -->
        <div id="toast-notification"
            class="hidden absolute top-20 left-4 right-4 bg-zinc-800 border border-amber-500/50 text-white p-4 rounded-xl shadow-2xl z-50 flex items-start gap-3 slide-in-down">
            <div class="bg-amber-500/20 p-2 rounded-full mt-0.5">
                <i data-lucide="check-circle-2" class="w-5 h-5 text-amber-500"></i>
            </div>
            <div>
                <h4 id="toast-title" class="font-semibold text-sm"></h4>
                <p id="toast-message" class="text-xs text-zinc-400 mt-1"></p>
            </div>
        </div>

        <!-- Área de Conteúdo -->
        <main id="main-content" class="flex-1 overflow-y-auto px-6 py-6 relative">
            <!-- Os conteúdos das abas serão injetados aqui pelo JavaScript -->
        </main>

        <!-- Navegação Inferior (Bottom Nav) -->
        <nav id="bottom-nav"
            class="w-full app-bg border-t border-theme px-6 py-4 flex justify-between items-center z-20 mt-auto pb-safe">
            <button id="nav-agendamentos" onclick="App.setTab('agendamentos')"
                class="nav-btn flex flex-col items-center gap-1 w-16 transition-all duration-300 text-amber-500" data-tab="agendamentos">
                <div class="icon-container p-1.5 rounded-full transition-all duration-300 bg-amber-500/10">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
                </div>
                <span class="text-[10px] font-medium">Agenda</span>
            </button>
            <button id="nav-perfil" onclick="App.setTab('perfil')"
                class="nav-btn flex flex-col items-center gap-1 w-16 transition-all duration-300 text-zinc-500" data-tab="perfil">
                <div class="icon-container p-1.5 rounded-full transition-all duration-300 bg-transparent">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
                <span class="text-[10px] font-medium">Perfil</span>
            </button>
            <button id="nav-relatorios" onclick="App.setTab('relatorios')"
                class="nav-btn hidden flex flex-col items-center gap-1 w-16 transition-all duration-300 text-zinc-500"
                data-tab="relatorios">
                <div class="icon-container p-1.5 rounded-full transition-all duration-300 bg-transparent">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
                </div>
                <span class="text-[10px] font-medium">Relatório</span>
            </button>
            <button id="nav-barbearia" onclick="App.setTab('barbearia')"
                class="nav-btn hidden flex flex-col items-center gap-1 w-16 transition-all duration-300 text-zinc-500"
                data-tab="barbearia">
                <div class="icon-container p-1.5 rounded-full transition-all duration-300 bg-transparent">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><path d="m2 7 4.4-4.4a2.5 2.5 0 0 1 3.2-.2L12 5l2.4-2.6a2.5 2.5 0 0 1 3.2.2L22 7"/><path d="M4 11v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9"/><path d="M10 11h4"/><path d="M12 11v9"/></svg>
                </div>
                <span class="text-[10px] font-medium">Barbearia</span>
            </button>
            <button id="nav-configuracoes" onclick="App.setTab('configuracoes')"
                class="nav-btn flex flex-col items-center gap-1 w-16 transition-all duration-300 text-zinc-500"
                data-tab="configuracoes">
                <div class="icon-container p-1.5 rounded-full transition-all duration-300 bg-transparent">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                </div>
                <span class="text-[10px] font-medium">Ajustes</span>
            </button>
        </nav>

    </div>

    <!-- Modal de Confirmação Genérico -->
    <div id="confirm-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center px-6">
        <div class="absolute inset-0 bg-zinc-950/80 backdrop-blur-sm"></div>
        <div class="relative bg-zinc-900 border border-zinc-800 rounded-3xl p-6 shadow-2xl w-full max-w-sm scale-in">
            <div class="flex flex-col items-center text-center gap-4">
                <div id="confirm-icon-bg" class="bg-amber-500/10 p-4 rounded-2xl">
                    <i id="confirm-icon" data-lucide="help-circle" class="w-8 h-8 text-amber-500"></i>
                </div>
                <div>
                    <h3 id="confirm-title" class="text-xl font-bold text-zinc-100">Confirmar?</h3>
                    <p id="confirm-message" class="text-sm text-zinc-400 mt-2 leading-relaxed"></p>
                </div>
            </div>

            <div id="confirm-warning" class="hidden mt-4 p-3 bg-red-500/10 border border-red-500/20 rounded-xl flex gap-3 items-start text-left">
                <i data-lucide="alert-triangle" class="w-5 h-5 text-red-500 shrink-0"></i>
                <p class="text-[11px] text-red-400 leading-tight"><b>Atenção:</b> Ao mudar o celular, seu login passará a ser o novo número. O antigo será desativado.</p>
            </div>

            <div class="flex gap-3 mt-6">
                <button onclick="App.hideConfirmModal()" class="flex-1 py-3 rounded-xl font-bold transition-all duration-200 bg-zinc-800 text-zinc-400 hover:bg-zinc-700">
                    Cancelar
                </button>
                <button id="btn-confirm-action" class="flex-1 py-3 rounded-xl font-bold transition-all duration-200 bg-amber-500 text-zinc-950 hover:bg-amber-400 shadow-md shadow-amber-500/20">
                    Confirmar
                </button>
            </div>
        </div>
    </div>

    <!-- Lembrete Flutuante Global -->
    <div id="reminder-container"></div>
    <div id="modal-container"></div>

    <!-- Canvas para Confetes -->
    <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-[200]"></canvas>

    <!-- Configuração e Controle de Estado (Base) -->
    <script src="js/config.js" defer></script>
    <script src="js/state.js" defer></script>

    <!-- Módulos da Aplicação (Funcionalidades) -->
    <script src="js/auth.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/booking.js" defer></script>
    <script src="js/reports.js" defer></script>
    
    <!-- Renderização e Interface (Visual) -->
    <script src="js/effects.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/views.js" defer></script>

    <!-- Inicialização (Motor Principal) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/analytics.js" defer></script>
    <script src="js/app.js" defer></script>
</body>

</html>
